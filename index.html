<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Skeleton Quest with Teacher Wafi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #fff;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-card {
      background: rgba(30, 41, 59, 0.98);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 850px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(168, 85, 247, 0.3);
      border: 3px solid #a855f7;
      position: relative;
    }

    /* Teacher Banner */
    .teacher-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 18px;
      padding: 8px 16px;
      margin-bottom: 15px;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .teacher-avatar {
      width: 55px;
      height: 55px;
      flex-shrink: 0;
    }

    .teacher-info h2 {
      margin: 0;
      color: #38bdf8;
      font-size: 1.2rem;
    }

    .teacher-info p {
      margin: 2px 0 0 0;
      color: #facc15;
      font-size: 0.9rem;
      font-weight: 600;
    }

    h1.game-title {
      text-align: center;
      color: #facc15;
      margin: 0 0 6px 0;
      font-size: 1.8rem;
    }

    p.subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 1rem;
      margin: 0 0 15px 0;
    }

    /* Assembly Area */
    .assembly-layout {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .source-box {
      background: #0f172a;
      border: 2px dashed #64748b;
      padding: 12px;
      border-radius: 18px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      max-width: 280px;
    }

    .draggable-bone {
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .draggable-bone.selected {
      border-color: #facc15;
      background: rgba(250, 204, 21, 0.2);
      transform: scale(1.1);
    }

    /* Skeleton Frame */
    .skeleton-frame {
      background: #1e293b;
      border: 3px solid #a855f7;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 240px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    .drop-zone {
      width: 100%;
      border: 2px dashed #475569;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      transition: all 0.3s ease;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .zone-head { height: 75px; }
    .zone-chest { height: 75px; }
    .zone-arms { height: 65px; }
    .zone-legs { height: 95px; margin-bottom: 0; }

    .drop-zone.active-target {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    .drop-zone.filled {
      border: 2px solid #4ade80;
      background: rgba(74, 222, 128, 0.1);
    }

    /* Quiz Screen */
    .hidden { display: none !important; }

    .quiz-card {
      background: #0f172a;
      border-radius: 18px;
      padding: 16px;
      margin-top: 10px;
      border: 2px solid #38bdf8;
    }

    .quiz-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 14px;
    }

    .question-box {
      font-size: 1.25rem;
      color: #f8fafc;
      margin-bottom: 16px;
      line-height: 1.4;
      text-align: center;
      font-weight: 600;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 2px solid #475569;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 1.1rem;
      cursor: pointer;
      text-align: center;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .opt-btn:active, .opt-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    /* Result */
    .result-screen { text-align: center; padding: 20px 10px; }
    .score-badge {
      font-size: 3.8rem;
      color: #4ade80;
      font-weight: 800;
      margin: 10px 0;
    }
    .award-title {
      font-size: 1.3rem;
      color: #facc15;
      background: #1e293b;
      border: 2px solid #facc15;
      padding: 8px 20px;
      border-radius: 40px;
      display: inline-block;
      font-weight: 700;
    }
    .restart-btn {
      background: #4ade80;
      color: #0f172a;
      border: none;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="game-card">
  
  <div class="teacher-header">
    <svg class="teacher-avatar" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="#a855f7"/>
      <path d="M 22 42 C 22 18, 78 18, 78 42 C 78 68, 85 85, 82 92 C 78 96, 22 96, 18 92 C 15 85, 22 68, 22 42 Z" fill="#ec4899"/>
      <ellipse cx="50" cy="48" rx="18" ry="22" fill="#fcd34d"/>
      <circle cx="43" cy="45" r="3" fill="#0f172a"/>
      <circle cx="57" cy="45" r="3" fill="#0f172a"/>
      <path d="M 43 55 Q 50 62 57 55" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 33 34 Q 50 28 67 34 C 67 30, 33 30, 33 34 Z" fill="#38bdf8"/>
    </svg>
    <div class="teacher-info">
      <h2>Class with Teacher Wafi 👩‍🏫</h2>
      <p>Year 2 English Game</p>
    </div>
  </div>

  <!-- PHASE 1 -->
  <div id="phase1">
    <h1 class="game-title">🦴 Build the Skeleton!</h1>
    <p class="subtitle">Tap a bone, then tap the matching spot on the body!</p>
    
    <div class="assembly-layout">
      <div class="source-box" id="sourceBox">
        <svg class="draggable-bone" id="part-head" data-type="head" width="75" height="75" viewBox="0 0 100 100">
          <path d="M 20 50 A 30 30 0 1 1 80 50 A 20 20 0 0 1 70 80 L 30 80 A 20 20 0 0 1 20 50 Z" fill="#f8fafc"/>
          <circle cx="38" cy="48" r="7" fill="#0f172a"/>
          <circle cx="62" cy="48" r="7" fill="#0f172a"/>
          <path d="M 42 62 L 50 56 L 58 62" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
          <line x1="38" y1="72" x2="62" y2="72" stroke="#0f172a" stroke-width="3"/>
        </svg>

        <svg class="draggable-bone" id="part-chest" data-type="chest" width="80" height="75" viewBox="0 0 100 100">
          <line x1="50" y1="10" x2="50" y2="90" stroke="#f8fafc" stroke-width="8"/>
          <path d="M 25 25 Q 50 15 75 25 M 20 40 Q 50 30 80 40 M 20 55 Q 50 45 80 55 M 25 70 Q 50 60 75 70" stroke="#f8fafc" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>

        <svg class="draggable-bone" id="part-arms" data-type="arms" width="95" height="60" viewBox="0 0 120 80">
          <path d="M 20 20 L 50 35 L 20 65 M 100 20 L 70 35 L 100 65" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" fill="none"/>
          <circle cx="50" cy="35" r="5" fill="#cbd5e1"/>
          <circle cx="70" cy="35" r="5" fill="#cbd5e1"/>
        </svg>

        <svg class="draggable-bone" id="part-legs" data-type="legs" width="80" height="75" viewBox="0 0 100 100">
          <path d="M 40 10 L 35 90 M 60 10 L 65 90 M 35 90 L 25 95 M 65 90 L 75 95" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
          <circle cx="35" cy="50" r="6" fill="#cbd5e1"/>
          <circle cx="65" cy="50" r="6" fill="#cbd5e1"/>
        </svg>
      </div>

      <div class="skeleton-frame">
        <div class="drop-zone zone-head" data-slot="head">💀 Head</div>
        <div class="drop-zone zone-chest" data-slot="chest">🦴 Chest</div>
        <div class="drop-zone zone-arms" data-slot="arms">🦾 Arms</div>
        <div class="drop-zone zone-legs" data-slot="legs">🦵 Legs</div>
      </div>
    </div>
  </div>

  <!-- PHASE 2 -->
  <div id="phase2" class="hidden">
    <h1 class="game-title">⭐ Teacher Wafi's Quiz ⭐</h1>
    <div class="quiz-card">
      <div class="quiz-bar">
        <span>Year 2 English Quiz</span>
        <span id="scoreText">Score: 0</span>
      </div>
      <div class="question-box" id="questionText">Loading...</div>
      <div class="options-grid" id="optionsContainer"></div>
    </div>
  </div>

  <!-- PHASE 3 -->
  <div id="phase3" class="hidden result-screen">
    <h1 class="game-title">🎉 Well Done!</h1>
    <p class="subtitle">Teacher Wafi is very happy with you!</p>
    <div class="score-badge" id="finalScore">0 / 50</div>
    <div class="award-title" id="badgeText">Super Star Pupil!</div>
    <br>
    <button class="restart-btn" onclick="location.reload()">🔄 Play Again</button>
  </div>

</div>

<script>
  let selectedBone = null;
  let filledCount = 0;
  let score = 0;
  let qIndex = 0;

  const questions = [
    { question: "1. What are the bones inside our body called? 💀", options: ["A) Skeleton", "B) Hair"], correct: 0 },
    { question: "2. Which bone is at the top of our body? 💀", options: ["A) Foot", "B) Head"], correct: 1 },
    { question: "3. What do our bones help us do? 🏃‍♂️", options: ["A) Move and stand", "B) Sleep"], correct: 0 },
    { question: "4. Do humans have bones inside their bodies? 🧍‍♂️", options: ["A) Yes", "B) No"], correct: 0 },
    { question: "5. Do animals like dogs and cats have skeletons? 🐶", options: ["A) Yes", "B) No"], correct: 0 }
  ];

  // Selection Logic for Bones
  const bones = document.querySelectorAll('.draggable-bone');
  const zones = document.querySelectorAll('.drop-zone');

  bones.forEach(bone => {
    bone.addEventListener('click', () => {
      bones.forEach(b => b.classList.remove('selected'));
      bone.classList.add('selected');
      selectedBone = bone;
      zones.forEach(z => {
        if(z.dataset.slot === bone.dataset.type && !z.classList.contains('filled')) {
          z.classList.add('active-target');
        } else {
          z.classList.remove('active-target');
        }
      });
    });
  });

  zones.forEach(zone => {
    zone.addEventListener('click', () => {
      if (!selectedBone) return;
      
      if (selectedBone.dataset.type === zone.dataset.slot && !zone.classList.contains('filled')) {
        zone.innerHTML = '';
        zone.appendChild(selectedBone);
        zone.classList.add('filled');
        zone.classList.remove('active-target');
        selectedBone.classList.remove('selected');
        selectedBone.style.cursor = 'default';
        selectedBone = null;
        filledCount++;

        if (filledCount === 4) {
          setTimeout(() => {
            alert("🌟 Great Job! You built the full skeleton! Let's start the Quiz!");
            startQuiz();
          }, 300);
        }
      } else {
        alert("❌ That spot doesn't match! Try another spot!");
      }
    });
  });

  function startQuiz() {
    document.getElementById('phase1').classList.add('hidden');
    document.getElementById('phase2').classList.remove('hidden');
    loadQuestion();
  }

  function loadQuestion() {
    const q = questions[qIndex];
    document.getElementById('questionText').textContent = q.question;
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => {
        if (idx === q.correct) {
          score += 10;
          alert("✅ Correct! +10 Points!");
        } else {
          alert("❌ Oops! Wrong answer!");
        }
        document.getElementById('scoreText').textContent = `Score: ${score}`;
        qIndex++;
        if (qIndex < questions.length) loadQuestion();
        else showResult();
      };
      container.appendChild(btn);
    });
  }

  function showResult() {
    document.getElementById('phase2').classList.add('hidden');
    document.getElementById('phase3').classList.remove('hidden');
    document.getElementById('finalScore').textContent = `${score} / 50`;
    const badge = document.getElementById('badgeText');
    if (score === 50) badge.textContent = "🌟 Teacher Wafi's Super Star!";
    else if (score >= 30) badge.textContent = "🦴 Skeleton Explorer!";
    else badge.textContent = "🎈 Good Try!";
  }
</script>

</body>
</html>
