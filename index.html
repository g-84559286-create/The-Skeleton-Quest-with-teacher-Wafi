<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Skeleton Quest with Teacher Wafi</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    .container {
      background: #1e293b;
      border: 3px solid #a855f7;
      border-radius: 16px;
      padding: 15px;
      max-width: 500px;
      margin: auto;
    }
    .header {
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #a855f7;
    }
    .status-box {
      background: #334155;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      color: #facc15;
      font-weight: bold;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 15px 10px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
    button:active {
      background: #facc15;
    }
    button:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .hidden { display: none; }
    .quiz-btn {
      width: 100%;
      margin-bottom: 10px;
      background: #1e293b;
      color: #fff;
      border: 2px solid #38bdf8;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 style="margin:0; color:#38bdf8;">Class with Teacher Wafi 👩‍🏫</h2>
    <p style="margin:5px 0 0 0; color:#facc15;">Year 2 English Game</p>
  </div>

  <!-- PHASE 1 -->
  <div id="phase1">
    <h2 style="color:#facc15;">1. Tap a Bone</h2>
    <div class="status-box" id="statusText">Select a bone below!</div>
    
    <div class="btn-grid">
      <button id="b-head" onclick="pickBone('Head')">💀 1. Head</button>
      <button id="b-chest" onclick="pickBone('Chest')">🦴 2. Chest</button>
      <button id="b-arms" onclick="pickBone('Arms')">🦾 3. Arms</button>
      <button id="b-legs" onclick="pickBone('Legs')">🦵 4. Legs</button>
    </div>

    <h2 style="color:#facc15;">2. Tap Spot on Body</h2>
    <div class="btn-grid">
      <button onclick="placeBone('Head')">Spot 1: Head</button>
      <button onclick="placeBone('Chest')">Spot 2: Chest</button>
      <button onclick="placeBone('Arms')">Spot 3: Arms</button>
      <button onclick="placeBone('Legs')">Spot 4: Legs</button>
    </div>
  </div>

  <!-- PHASE 2 -->
  <div id="phase2" class="hidden">
    <h2 style="color:#facc15;">⭐ Teacher Wafi's Quiz ⭐</h2>
    <p id="scoreDisplay" style="color:#38bdf8; font-weight:bold;">Score: 0</p>
    <h3 id="questionText">Question goes here</h3>
    <div id="optionsBox"></div>
  </div>

  <!-- PHASE 3 -->
  <div id="phase3" class="hidden">
    <h1 style="color:#4ade80;">🎉 Well Done!</h1>
    <h2 id="finalScore" style="color:#facc15;">0 / 50</h2>
    <button onclick="location.reload()" style="background:#4ade80; color:#0f172a;">🔄 Play Again</button>
  </div>
</div>

<script>
  var chosenBone = "";
  var completed = 0;
  var score = 0;
  var qIdx = 0;

  var questions = [
    { q: "1. What are the bones inside our body called? 💀", opts: ["Skeleton", "Hair"], ans: 0 },
    { q: "2. Which bone is at the top of our body? 💀", opts: ["Foot", "Head"], ans: 1 },
    { q: "3. What do our bones help us do? 🏃‍♂️", opts: ["Move and stand", "Sleep"], ans: 0 },
    { q: "4. Do humans have bones inside their bodies? 🧍‍♂️", opts: ["Yes", "No"], ans: 0 },
    { q: "5. Do animals like dogs and cats have skeletons? 🐶", opts: ["Yes", "No"], ans: 0 }
  ];

  function pickBone(name) {
    chosenBone = name;
    document.getElementById('statusText').innerText = "Selected: " + name + "! Now tap 'Spot " + name + "'";
  }

  function placeBone(spot) {
    if (chosenBone === "") {
      alert("Please tap a bone from Step 1 first!");
      return;
    }

    if (chosenBone === spot) {
      alert("✅ Correct! Fitted " + spot + "!");
      document.getElementById('b-' + spot.toLowerCase()).disabled = true;
      chosenBone = "";
      document.getElementById('statusText').innerText = "Great! Select the next bone.";
      completed++;

      if (completed === 4) {
        alert("🎉 Skeleton Complete! Moving to Quiz!");
        document.getElementById('phase1').classList.add('hidden');
        document.getElementById('phase2').classList.remove('hidden');
        loadQuiz();
      }
    } else {
      alert("❌ Wrong spot! Try matching " + chosenBone + " to Spot " + chosenBone);
    }
  }

  function loadQuiz() {
    var cur = questions[qIdx];
    document.getElementById('questionText').innerText = cur.q;
    var box = document.getElementById('optionsBox');
    box.innerHTML = "";

    cur.opts.forEach(function(opt, idx) {
      var btn = document.createElement('button');
      btn.className = "quiz-btn";
      btn.innerText = opt;
      btn.onclick = function() {
        if (idx === cur.ans) {
          score += 10;
          alert("✅ Correct! +10 Points");
        } else {
          alert("❌ Wrong Answer!");
        }
        document.getElementById('scoreDisplay').innerText = "Score: " + score;
        qIdx++;
        if (qIdx < questions.length) {
          loadQuiz();
        } else {
          document.getElementById('phase2').classList.add('hidden');
          document.getElementById('phase3').classList.remove('hidden');
          document.getElementById('finalScore').innerText = "Score: " + score + " / 50";
        }
      };
      box.appendChild(btn);
    });
  }
</script>

</body>
</html>
