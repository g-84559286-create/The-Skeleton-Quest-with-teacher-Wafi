<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Skeleton Quest with Teacher Wafi</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 16px;
      width: 100%;
      max-width: 800px;
      border: 3px solid #a855f7;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Teacher Banner Header */
    .teacher-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0f172a;
      border-radius: 16px;
      padding: 8px 14px;
      margin-bottom: 12px;
      border: 1px solid #a855f7;
    }

    .teacher-avatar {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      pointer-events: none;
    }

    .teacher-info h2 {
      margin: 0;
      color: #38bdf8;
      font-size: 1.1rem;
    }

    .teacher-info p {
      margin: 2px 0 0 0;
      color: #facc15;
      font-size: 0.85rem;
      font-weight: bold;
    }

    h1.game-title {
      text-align: center;
      color: #facc15;
      margin: 0 0 4px 0;
      font-size: 1.5rem;
    }

    p.subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 0.95rem;
      margin: 0 0 12px 0;
    }

    /* Phase 1 Layout */
    .assembly-layout {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .source-box {
      background: #0f172a;
      border: 2px dashed #64748b;
      padding: 10px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 280px;
    }

    /* Bone Cards With Graphics */
    .bone-card {
      background: #334155;
      border: 3px solid #64748b;
      border-radius: 12px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 105px;
      touch-action: manipulation;
    }

    .bone-card.selected {
      border-color: #facc15;
      background: #ca8a04;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.7);
    }

    .bone-card.used {
      opacity: 0.2;
      pointer-events: none;
      border-color: #1e293b;
    }

    .bone-card span {
      font-size: 0.8rem;
      font-weight: bold;
      color: #ffffff;
      margin-top: 4px;
      pointer-events: none;
    }

    /* Kunci grafik SVG supaya klik/tap diproses pada butang utama */
    .bone-card svg, .drop-zone svg {
      pointer-events: none;
    }

    /* Skeleton Stand Frame */
    .skeleton-frame {
      background: #0f172a;
      border: 3px solid #a855f7;
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 230px;
    }

    .drop-zone {
      width: 100%;
      border: 2px dashed #475569;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(30, 41, 59, 0.5);
      color: #94a3b8;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 6px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .zone-head { height: 75px; }
    .zone-chest { height: 75px; }
    .zone-arms { height: 65px; }
    .zone-legs { height: 90px; margin-bottom: 0; }

    .drop-zone.active-target {
      border-color: #38bdf8;
      background: #0284c7;
      color: #ffffff;
    }

    .drop-zone.filled {
      border: 2px solid #22c55e;
      background: rgba(34, 197, 94, 0.2);
    }

    /* Quiz Screen */
    .hidden { display: none !important; }
