<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Skeleton Quest with Teacher Wafi</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-card {
      background-color: #1e293b;
      border-radius: 20px;
      padding: 16px;
      width: 100%;
      max-width: 650px;
      border: 3px solid #a855f7;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Teacher Banner Header */
    .teacher-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: #0f172a;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #a855f7;
    }

    .teacher-avatar {
      font-size: 2.5rem;
    }

    .teacher-info h2 {
      margin: 0;
      color: #38bdf8;
      font-size: 1.1rem;
    }

    .teacher-info p {
      margin: 2px 0 0 0;
      color: #facc15;
      font-size: 0.85rem;
      font-weight: bold;
    }

    h1.game-title {
      text-align: center;
      color: #facc15;
      margin: 0 0 4px 0;
      font-size: 1.4rem;
    }

    .status-alert {
      background-color: #334155;
      border: 2px solid #38bdf8;
      color: #facc15;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }

    /* Assembly Grid Layout */
    .section-title {
      color: #38bdf8;
      font-size: 1rem;
      margin: 10px 0 6px 0;
      font-weight: bold;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .action-btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 8px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .action-btn:active {
      background-color: #facc15;
      transform: scale(0.98);
    }

    .action-btn.selected {
      background-color: #facc15;
      color: #0f172a;
      box-shadow: 0 0 12px #facc15;
    }

    .action-btn:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.4;
    }

    .spot-btn {
      background-color: #0f172a;
      color: #cbd5e1;
      border: 2px dashed #64748b;
      padding: 14px 8px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }

    .spot-btn.active-target {
      border-color: #facc15;
      background-color: rgba(250, 204, 21, 0.2);
      color: #ffffff;
    }

    .spot-btn.filled {
      border: 2px solid #22c55e;
      background-color: #15803d;
      color: #ffffff;
    }

    /* Quiz Screen */
    .hidden { display: none !important; }

    .quiz-card {
      background-color: #0f172a;
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
      border: 2px solid #38bdf8;
    }

    .quiz-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .question-box {
      font-size: 1.1rem;
      color: #f8fafc;
      margin-bottom: 14px;
      line-height: 1.4;
      text-align: center;
      font-weight: bold;
    }

    .quiz-btn {
      width: 100%;
      margin-bottom: 10px;
      background-color: #1e293b;
      color: #ffffff;
      border: 2px solid #475569;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .quiz-btn:active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    /* Result Screen */
    .result-screen { text-align: center; padding: 20px 10px; }
    .score-badge {
      font-size: 3.5rem;
      color: #22c55e;
      font-weight: 800;
      margin: 10px 0;
    }
    .award-title {
      font-size: 1.2rem;
      color: #facc15;
      background-color: #0f172a;
      border: 2px solid #facc15;
      padding: 8px 20px;
      border-radius: 40px;
      display: inline-block;
      font-weight: bold;
    }
    .restart-btn {
      background-color: #22c55e;
      color: #0f172a;
      border: none;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="game-card">
  
  <!-- Teacher Banner -->
  <div class="teacher-header">
    <div class="teacher-avatar">👩‍🏫</div>
    <div class="teacher-info">
      <h2>Class with Teacher Wafi</h2>
      <p>Year 2 English Game</p>
    </div>
  </div>

  <!-- PHASE 1: SKELETON BUILD -->
  <div id="phase1">
    <h1 class="game-title">🦴 Build the Skeleton!</h1>
    
    <div class="status-alert" id="statusText">
      Step 1: Tap a bone below!
    </div>

    <div class="section-title">1. Tap a bone picture:</div>
    <div class="btn-grid">
      <button class="action-btn" id="b-head" onclick="pickBone('head')">💀 1. Head</button>
      <button class="action-btn" id="b-chest" onclick="pickBone('chest')">🦴 2. Chest</button>
      <button class="action-btn" id="b-arms" onclick="pickBone('arms')">🦾 3. Arms</button>
      <button class="action-btn" id="b-legs" onclick="pickBone('legs')">🦵 4. Legs</button>
    </div>

    <div class="section-title">2. Tap matching spot on body:</div>
    <div class="btn-grid">
      <button class="spot-btn" id="s-head" onclick="placeBone('head')">Spot 1: Head</button>
      <button class="spot-btn" id="s-chest" onclick="placeBone('chest')">Spot 2: Chest</button>
      <button class="spot-btn" id="s-arms" onclick="placeBone('arms')">Spot 3: Arms</button>
      <button class="spot-btn" id="s-legs" onclick="placeBone('legs')">Spot 4: Legs</button>
    </div>
  </div>

  <!-- PHASE 2: QUIZ -->
  <div id="phase2" class="hidden">
    <h1 class="game-title">⭐ Teacher Wafi's Quiz ⭐</h1>
    <div class="quiz-card">
      <div class="quiz-bar">
        <span>Year 2 Quiz</span>
        <span id="scoreText">Score: 0</span>
      </div>
      <div class="question-box" id="questionText">Loading question...</div>
      <div id="optionsContainer"></div>
    </div>
  </div>

  <!-- PHASE 3: RESULTS -->
  <div id="phase3" class="hidden result-screen">
    <h1 class="game-title">🎉 Well Done!</h1>
    <p style="color:#cbd5e1;">Teacher Wafi is very proud of you!</p>
    <div class="score-badge" id="finalScore">0 / 50</div>
    <div class="award-title" id="badgeText">Super Star Pupil!</div>
    <br>
    <button class="restart-btn" onclick="location.reload()">🔄 Play Again</button>
  </div>

</div>

<script>
  var selectedBone = null;
  var completedCount = 0;
  var score = 0;
  var qIndex = 0;

  var boneLabels = {
    head: '💀 Head',
    chest: '🦴 Chest',
    arms: '🦾 Arms',
    legs: '🦵 Legs'
  };

  var questions = [
    { question: "1. What are the bones inside our body called? 💀", options: ["A) Skeleton", "B) Hair"], correct: 0 },
    { question: "2. Which bone is at the top of our body? 💀", options: ["A) Foot", "B) Head"], correct: 1 },
    { question: "3. What do our bones help us do? 🏃‍♂️", options: ["A) Move and stand", "B) Sleep"], correct: 0 },
    { question: "4. Do humans have bones inside their bodies? 🧍‍♂️", options: ["A) Yes", "B) No"], correct: 0 },
    { question: "5. Do animals like dogs and cats have skeletons? 🐶", options: ["A) Yes", "B) No"], correct: 0 }
  ];

  function pickBone(type) {
    // Reset all selection styles
    var buttons = document.querySelectorAll('.action-btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove('selected');
    }

    var spots = document.querySelectorAll('.spot-btn');
    for (var j = 0; j < spots.length; j++) {
      spots[j].classList.remove('active-target');
    }

    // Set selected
    selectedBone = type;
    var btn = document.getElementById('b-' + type);
    if (btn) btn.classList.add('selected');

    var targetSpot = document.getElementById('s-' + type);
    if (targetSpot && !targetSpot.classList.contains('filled')) {
      targetSpot.classList.add('active-target');
    }

    document.getElementById('statusText').innerText = "Selected " + type.toUpperCase() + "! Now tap 'Spot: " + type.toUpperCase() + "'";
  }

  function placeBone(targetType) {
    if (!selectedBone) {
      alert("👉 Please tap a bone from Step 1 first!");
      return;
    }

    if (selectedBone === targetType) {
      var spotBtn = document.getElementById('s-' + targetType);
      var boneBtn = document.getElementById('b-' + targetType);

      spotBtn.innerText = "✅ " + boneLabels[targetType];
      spotBtn.classList.add('filled');
      spotBtn.classList.remove('active-target');

      boneBtn.disabled = true;
      boneBtn.classList.remove('selected');

      selectedBone = null;
      completedCount++;
      document.getElementById('statusText').innerText = "Great! Select the next bone.";

      if (completedCount === 4) {
        setTimeout(function() {
          alert("🎉 Skeleton Complete! Let's start Teacher Wafi's Quiz!");
          startQuiz();
        }, 300);
      }
    } else {
      alert("❌ Wrong spot! Match " + selectedBone.toUpperCase() + " to Spot " + selectedBone.toUpperCase());
    }
  }

  function startQuiz() {
    document.getElementById('phase1').classList.add('hidden');
    document.getElementById('phase2').classList.remove('hidden');
    loadQuestion();
  }

  function loadQuestion() {
    var q = questions[qIndex];
    document.getElementById('questionText').innerText = q.question;
    var container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    for (var i = 0; i < q.options.length; i++) {
      (function(index) {
        var btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.innerText = q.options[index];
        btn.onclick = function() {
          if (index === q.correct) {
            score += 10;
            alert("✅ Correct! +10 Points!");
          } else {
            alert("❌ Oops! Wrong answer!");
          }
          document.getElementById('scoreText').innerText = "Score: " + score;
          qIndex++;
          if (qIndex < questions.length) {
            loadQuestion();
          } else {
            showResult();
          }
        };
        container.appendChild(btn);
      })(i);
    }
  }

  function showResult() {
    document.getElementById('phase2').classList.add('hidden');
    document.getElementById('phase3').classList.remove('hidden');
    document.getElementById('finalScore').innerText = score + " / 50";
    var badge = document.getElementById('badgeText');
    if (score === 50) badge.innerText = "🌟 Teacher Wafi's Super Star!";
    else if (score >= 30) badge.innerText = "🦴 Skeleton Explorer!";
    else badge.innerText = "🎈 Good Try!";
  }
</script>

</body>
</html>
